<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__ - JUPITER 3D Explainer</title>
<style>
:root{--bg:#070d18;--panel:rgba(9,20,36,.82);--line:#27406b;--cy:#2bd9ff;--tx:#d7ecf7;--dim:#7f9bb0;--ok:#35e08a;--warn:#ffb020}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.45 "Segoe UI",system-ui,Arial,sans-serif;overflow:hidden}
#app{position:fixed;inset:0}canvas{position:absolute;left:0;top:0;display:block}canvas.gl{cursor:grab}canvas.ov{pointer-events:none}
.side{position:absolute;left:14px;top:14px;bottom:78px;width:268px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;backdrop-filter:blur(6px);display:flex;flex-direction:column;overflow:hidden}
.brand{font-size:10px;letter-spacing:.18em;color:var(--cy);margin-bottom:4px}
h1{font-size:19px;margin:0 0 8px;font-weight:600;line-height:1.2}
.badge{display:inline-block;align-self:flex-start;font-size:10px;letter-spacing:.08em;padding:3px 8px;border-radius:20px;border:1px solid;margin-bottom:8px}
.badge.ok{color:var(--ok);border-color:var(--ok);background:rgba(53,224,138,.08)}.badge.warn{color:var(--warn);border-color:var(--warn);background:rgba(255,176,32,.08)}
.sum{margin:0 0 8px;color:var(--tx)}.disc{margin:0 0 8px;color:var(--warn);font-size:11.5px}
.hd{font-size:10px;letter-spacing:.14em;color:var(--dim);margin:6px 0 5px}
.plist{overflow:auto;flex:1;margin:0 -4px;padding:0 4px}.plist::-webkit-scrollbar{width:6px}.plist::-webkit-scrollbar-thumb{background:#27406b;border-radius:3px}
.row{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.row i{width:10px;height:10px;border-radius:3px;flex:none}.row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.hov{background:rgba(43,217,255,.08)}.row.sel{background:rgba(43,217,255,.16);border-color:var(--cy)}
.meta{font-size:10.5px;color:var(--dim);margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
.card{position:absolute;right:14px;top:14px;width:290px;background:var(--panel);border:1px solid var(--cy);border-radius:12px;padding:14px;backdrop-filter:blur(6px);box-shadow:0 0 24px rgba(43,217,255,.12)}
.cn{font-size:16px;font-weight:600;margin-bottom:2px}.grp{display:inline-block;font-size:10px;letter-spacing:.1em;color:var(--cy);margin-bottom:6px}
.pp{margin-bottom:8px}.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{padding:2px 8px;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-size:11.5px;background:rgba(43,217,255,.06)}.chip:hover{border-color:var(--cy)}
.dim{color:var(--dim)}.sty{margin-top:8px;font-size:11px;color:var(--warn)}
.tip{position:absolute;display:none;max-width:250px;pointer-events:none;background:rgba(6,16,30,.94);border:1px solid var(--cy);border-radius:8px;padding:7px 10px;font-size:12px;z-index:5}
.bar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:max-content;display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;backdrop-filter:blur(6px);flex-wrap:wrap;justify-content:center;max-width:calc(100% - 28px);white-space:nowrap}
.bar button{background:#12233f;color:var(--tx);border:1px solid #27406b;border-radius:8px;padding:6px 11px;font:inherit;cursor:pointer}.bar button:hover{border-color:var(--cy)}.bar button.on{background:#0f4a63;border-color:var(--cy)}
.sl{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.14em;color:var(--dim)}.sl input{width:130px;accent-color:var(--cy)}
.cap{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);background:rgba(8,40,60,.92);border:1px solid var(--cy);border-radius:10px;padding:8px 16px;max-width:560px;text-align:center}
.cap b{display:block;color:var(--cy)}.cap span{color:var(--tx)}
.err{position:absolute;left:50%;top:40%;transform:translateX(-50%);background:#3a1620;border:1px solid #ff5a6e;border-radius:10px;padding:12px 18px;z-index:9}
.hud{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:rgba(8,40,60,.92);border:1px solid var(--cy);border-radius:20px;padding:5px 16px;z-index:8;font-size:13px}
.hcur{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border:2px solid #ffe14d;border-radius:50%;pointer-events:none;z-index:7;box-shadow:0 0 12px #ffe14d}
@media (max-width:760px){.side{display:none}.card{width:230px}}
</style></head>
<body><div id="app"></div>
<script id="spec" type="application/json">__SPEC__</script>
<script>__VIEWER_JS__</script></body></html>
